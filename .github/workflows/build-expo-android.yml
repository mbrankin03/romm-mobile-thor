name: Build APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 📱 Build Standalone Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: |
          npm ci --prefer-offline --no-audit

      - name: 📋 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🚀 Build Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🔍 Locate and Stage APK
        id: locate-apk
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          fi
          
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "❌ No APK found in android/app/build/outputs/apk"
            exit 1
          fi
          
          echo "Found APK at: $APK_SRC"
          cp "$APK_SRC" RommThor.apk
          
          # Also make a tagged copy if on a tag/release
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            cp "$APK_SRC" "RommThor-${TAG_NAME}.apk"
            echo "created_tagged=RommThor-${TAG_NAME}.apk" >> $GITHUB_OUTPUT
          fi
          
          echo "apk_path=RommThor.apk" >> $GITHUB_OUTPUT
          ls -lh RommThor*.apk

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RommThor-APK
          path: RommThor*.apk
          retention-days: 30

      - name: 🏷️ Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RommThor.apk
            RommThor-*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
